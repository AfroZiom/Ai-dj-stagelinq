name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Capacitor Android
        run: npm install @capacitor/android

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync
        run: npx cap sync android

      - name: Create StageLinq plugin
        run: |
          mkdir -p android/app/src/main/java/pl/aidj/assistant

          cat > android/app/src/main/java/pl/aidj/assistant/StageLinqPlugin.java <<'EOF'
          package pl.aidj.assistant;

          import android.net.wifi.WifiManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "StageLinq")
          public class StageLinqPlugin extends Plugin {

              private WifiManager.MulticastLock lock;

              @PluginMethod
              public void getNetworkStatus(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("stageLinqImplemented", true);
                  result.put("message", "StageLinQ moduł Android aktywny.");
                  call.resolve(result);
              }

              @PluginMethod
              public void acquireMulticastLock(PluginCall call) {
                  try {
                      WifiManager wifi =
                          (WifiManager) getContext()
                          .getApplicationContext()
                          .getSystemService(android.content.Context.WIFI_SERVICE);

                      if (wifi == null) {
                          call.reject("Brak Wi-Fi.");
                          return;
                      }

                      if (lock == null) {
                          lock = wifi.createMulticastLock("AI-DJ-StageLinq");
                          lock.setReferenceCounted(false);
                      }

                      if (!lock.isHeld()) {
                          lock.acquire();
                      }

                      JSObject result = new JSObject();
                      result.put("active", true);
                      call.resolve(result);

                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void discover(PluginCall call) {
                  new Thread(() -> {
                      try {
                          byte[] data = "airD".getBytes(StandardCharsets.US_ASCII);

                          DatagramSocket socket = new DatagramSocket();
                          socket.setBroadcast(true);

                          DatagramPacket packet =
                              new DatagramPacket(
                                  data,
                                  data.length,
                                  InetAddress.getByName("255.255.255.255"),
                                  51337
                              );

                          socket.send(packet);
                          socket.close();

                          JSObject result = new JSObject();
                          result.put("started", true);
                          call.resolve(result);

                      } catch (Exception e) {
                          call.reject(e.getMessage());
                      }
                  }).start();
              }

              @Override
              protected void handleOnDestroy() {
                  if (lock != null && lock.isHeld()) {
                      lock.release();
                  }
                  super.handleOnDestroy();
              }
          }
          EOF

      - name: Register plugin
        run: |
          cat > android/app/src/main/java/pl/aidj/assistant/MainActivity.java <<'EOF'
          package pl.aidj.assistant;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StageLinqPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE"
          ]

          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}" />'
              if line not in s:
                  s = s.replace(
                      "<application",
                      line + "\n\n    <application",
                      1
                  )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-DJ-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
