<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.json">
<title>AI DJ Assistant</title>
<style>
:root{--bg:#0b0b10;--card:#161620;--card2:#1e1e2b;--line:#2a2a3a;--tx:#f2f2f7;--mut:#8b8ba0;--cy:#00e5ff;--pk:#ff2d78;--gr:#39ff88;--yl:#ffd23f;--rd:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)) 0}
main{padding:10px 12px;max-width:760px;margin:0 auto}
h2{font-size:13px;letter-spacing:.14em;color:var(--mut);margin:16px 2px 8px;text-transform:uppercase}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-height:46px;font-weight:700;letter-spacing:.02em}
button:active{transform:scale(.97)}
button.on{background:var(--cy);color:#001318;border-color:var(--cy)}
button.pk{background:var(--pk);border-color:var(--pk)}button.gr{background:var(--gr);color:#00210f;border-color:var(--gr)}
button.rd{background:#3a1216;border-color:var(--rd);color:#ffb3b3}button.em{background:var(--rd);border-color:var(--rd);color:#fff}
button.sm{min-height:38px;padding:8px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.big{display:flex;gap:10px;margin-top:10px}.big div{flex:1;background:var(--card2);border-radius:12px;padding:8px 6px;text-align:center}
.big b{display:block;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}.big small{color:var(--mut);font-size:11px;letter-spacing:.12em}
.cur .name{font-size:19px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700}
.chip.act{background:#06343b;border-color:var(--cy);color:var(--cy)}
.rec{border-left:4px solid var(--cy)}.rec.sel{border-left-color:var(--gr);background:#10201a}
.rec .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rank{font-size:26px;font-weight:900;color:var(--cy);min-width:28px}
.score{font-size:24px;font-weight:900;color:var(--gr);text-align:right}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.meta span{background:var(--card2);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.up{color:var(--gr)}.dn{color:var(--yl)}
.reason{font-size:14px;color:#d6d6e4;margin:6px 0 10px;line-height:1.35}
.badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#2b2b40;color:var(--mut)}.badge.ai{background:var(--pk);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0e15;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;border-radius:10px;font-size:11px;padding:8px 2px;color:var(--mut);min-height:52px}
nav button.on{background:none;color:var(--cy)}nav button i{display:block;font-style:normal;font-size:20px}
.warn{background:#3a2d0a;border:1px solid var(--yl);color:#ffe9a3;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow:auto}
.msg{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:92%;line-height:1.35;font-size:15px}
.msg.me{background:#06343b;margin-left:auto}.msg.ai{background:var(--card2)}
.item{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center}
svg.chart{width:100%;height:90px;background:var(--card2);border-radius:12px}
.hide{display:none}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<script src="engine.js"></script>
<script src="demo.js"></script>
<script>
"use strict";
const E = window.Engine;
const KEY = "aidj_state_v2";
const MODES = ["WARM UP", "BUILDING", "MAIN", "PEAK TIME", "AFTER PEAK", "CLOSING", "CUSTOM"];
const AGES = ["18–24", "25–34", "35–44", "45+"];
const MUSIC = ["Commercial","Club","House","Tech House","EDM","Hip-Hop","Pop","Dance","2000s","2010s","2020s","Polish Hits","Polish Pop","Polish Dance","Polish Club","Polish Classics","International Hits","Mixed"];
const SIZES = ["Small", "Medium", "Large", "Very Large"];
const EVENTS = ["Club","Wedding","Festival","Private Party","Corporate","Beach Party","Student Party","Other"];
const REASONS = ["Too Slow","Too Fast","Wrong Genre","Too Commercial","Not Commercial Enough","Too Low Energy","Too High Energy","Bad Transition","Already Played","Don't Like Artist"];
const WLABEL = {music_compatibility:"Zgodność muzyczna",energy_flow:"Przepływ energii",bpm:"BPM",harmonic:"Harmonia",danceability:"Danceability",popularity:"Popularność",crowd:"Profil publiczności",set_history:"Historia seta"};

const DEF = () => ({
  lib: [], nextId: 1, current: null, history: [], played: [], rejected: [], favs: [], blacklist: [], selected: null,
  mode: "MAIN", mods: null, sets: [], feedback: [], chat: [], setStart: Date.now(), recLog: {accepted: 0, rejected: 0, shown: 0},
  crowd: {age_groups: ["25–34"], music_preferences: ["Commercial", "Club"], crowd_size: "Medium", crowd_energy: 70, event_type: "Club"},
  weights: Object.assign({}, E.DEFAULT_WEIGHTS), profile: {g: {}, a: {}, bpm: []},
  cfg: {apiKey: "", model: "gpt-4o-mini", useAI: true, hourOverride: ""}
});
let S = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(DEF(), s, {cfg: Object.assign(DEF().cfg, s.cfg || {})}); } catch (e) {} return DEF(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Brak miejsca na zapis danych!"); } }
S.mods = S.mods || E.parseCommand("");
let tab = "play", view5 = false, recs = [], recLvl = 0, aiState = "", reqId = 0, aiCache = new Map(), next5 = [];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (v, d) => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? d : x; };
function toast(m) { const d = document.createElement("div"); d.textContent = m; d.style.cssText = "position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;z-index:50;font-weight:700;font-size:14px"; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function hourNow() { const o = S.cfg.hourOverride; if (o && /^\d{1,2}:\d{2}$/.test(o)) { const [h, m] = o.split(":"); return +h + +m / 60; } const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
const hhmm = h => String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round((h % 1) * 60)).padStart(2, "0");

/* ------------------------------------------------ profil DJ-a (uczenie się stylu) */
function bump(map, k, v) { if (!k) return; k = k.toLowerCase(); map[k] = Math.max(-12, Math.min(12, (map[k] || 0) + v)); }
function learn(t, w) { const g = (t.genre || "").toLowerCase().split(/\s+/)[0]; bump(S.profile.g, g, w); bump(S.profile.a, t.artist, w * 1.2); if (w > 0 && t.bpm) { S.profile.bpm.push(t.bpm); S.profile.bpm = S.profile.bpm.slice(-30); } }
function djProfile() { const n = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, Math.tanh(v / 5)]));
  const b = S.profile.bpm; return {genre_affinity: n(S.profile.g), artist_affinity: n(S.profile.a), bpm_center: b.length >= 5 ? b.reduce((x, y) => x + y, 0) / b.length : null}; }

/* ------------------------------------------------ kontekst i rekomendacje */
function ctx() {
  return {mode: S.mode, hour: hourNow(), mods: S.mods, weights: S.weights, crowd: S.crowd, dj_profile: djProfile(), history: S.history,
    recent_energies: S.history.map(h => h.energy).filter(e => e != null).slice(-4), played_ids: [...S.played, ...S.rejected],
    blacklist: new Set(S.blacklist.map(a => a.toLowerCase()))};
}
function summary(c) { const cur = S.current || {};
  return JSON.stringify({teraz: cur.artist ? `${cur.artist} - ${cur.title}, ${cur.bpm} BPM, ${cur.key}, energy ${cur.energy}, ${cur.genre}` : null, tryb: S.mode, godzina: hhmm(c.hour),
    cel_energii: Math.round(E.energyTarget(S.mode, c.hour, c.recent_energies, S.crowd.crowd_energy, S.mods.energy_delta || 0, cur.energy)), publicznosc: S.crowd,
    aktywne_polecenia: S.mods, ostatnie: S.history.slice(-5).map(h => `${h.artist} - ${h.title} (${h.bpm}/${h.energy})`), profil_dj: djProfile()}); }

function refresh() {
  if (!S.current) { recs = []; render(); return; }
  const c = ctx(); const [top, lvl, all] = E.recommend(S.lib, S.current, c, 5); recs = top.map((t, i) => Object.assign(t, {_rank: i + 1, _src: "LOKALNIE"})); recLvl = lvl;
  S.recLog.shown += recs.length; aiState = ""; next5 = view5 ? E.planNext5(S.lib, S.current, c, 5) : next5; render(); save();
  if (S.cfg.useAI && S.cfg.apiKey && all.length) aiRank(all.slice(0, 15), c);
}
async function openai(messages) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  const body = {model: S.cfg.model, response_format: {type: "json_object"}, messages};
  const call = async b => fetch("https://api.openai.com/v1/chat/completions", {method: "POST", signal: ctl.signal, headers: {"Content-Type": "application/json", Authorization: "Bearer " + S.cfg.apiKey}, body: JSON.stringify(b)});
  try {
    let r = await call(Object.assign({temperature: 0.3}, body));
    if (!r.ok) { const t = await r.text(); if (/temperature/i.test(t)) r = await call(body); else throw new Error(r.status === 401 ? "Klucz OpenAI jest nieprawidłowy" : r.status === 429 ? "Limit / brak środków na koncie OpenAI" : "Błąd OpenAI " + r.status); }
    if (!r.ok) throw new Error("Błąd OpenAI " + r.status);
    return JSON.parse((await r.json()).choices[0].message.content);
  } catch (e) { throw new Error(e.name === "AbortError" ? "AI nie odpowiedziało w 20 s" : (e.message || "Brak internetu")); } finally { clearTimeout(to); }
}
const compact = t => ({id: t.id, artist: t.artist, title: t.title, bpm: t.bpm, key_camelot: E.normalizeKey(t.key) || t.key, energy: t.energy, genre: t.genre, year: t.year, popularity: t.popularity, danceability: t.danceability, local_score: t._score});
const SYS = "Jesteś AI DJ ASSISTANT - ekspert od prowadzenia setów klubowych, ze świetną znajomością polskiej i międzynarodowej sceny dance/club. Wybierz i uargumentuj najlepsze NEXT TRACKI. DJ DECYDUJE, ty REKOMENDUJESZ. Wybieraj WYŁĄCZNIE spośród podanych kandydatów (po id). Odpowiadasz WYŁĄCZNIE poprawnym JSON.";
async function aiRank(cands, c) {
  const my = ++reqId, sum = summary(c), ck = sum + cands.map(t => t.id).join(",");
  let out = aiCache.get(ck);
  if (!out) {
    aiState = "AI analizuje…"; render();
    try {
      out = await openai([{role: "system", content: SYS}, {role: "user", content: JSON.stringify({context: sum, kandydaci_posortowani_wg_lokalnego_score: cands.map(compact), zadanie: "Wybierz TOP 5 i zwróć JSON: {\"recommendations\":[{\"track_id\":<id z listy>,\"reason\":\"1-2 zdania po polsku\"}],\"mode_suggestion\":\"WARM UP|BUILDING|MAIN|PEAK TIME|AFTER PEAK|CLOSING|null\"}"})}]);
      aiCache.set(ck, out);
    } catch (e) { if (my === reqId) { aiState = "AI niedostępne: " + e.message + " (ranking lokalny)"; render(); } return; }
  }
  if (my !== reqId) return;
  const byId = new Map(cands.map(t => [String(t.id), t])), seen = new Set(), pick = [];
  for (const r of out.recommendations || []) { const t = byId.get(String(r.track_id)); if (t && !seen.has(t.id)) { seen.add(t.id); pick.push(Object.assign({}, t, {_reason: String(r.reason || t._reason), _src: "AI"})); } }
  if (!pick.length) { aiState = "AI zwróciło nieprawidłowe utwory (ranking lokalny)"; render(); return; }
  for (const t of recs) if (pick.length < 5 && !seen.has(t.id)) pick.push(t);
  recs = pick.slice(0, 5).map((t, i) => Object.assign(t, {_rank: i + 1})); aiState = "";
  if (out.mode_suggestion && out.mode_suggestion !== "null" && MODES.includes(out.mode_suggestion) && out.mode_suggestion !== S.mode) aiState = "AI sugeruje tryb: " + out.mode_suggestion;
  render();
}

/* ------------------------------------------------ akcje DJ-a */
function mergeMods(a, b) { const m = Object.assign({}, a);
  m.energy_delta = Math.max(-40, Math.min(40, (a.energy_delta || 0) + (b.energy_delta || 0)));
  if (b.bpm_lock) { m.bpm_lock = true; m.widen_bpm = false; } if (b.widen_bpm) { m.widen_bpm = true; m.bpm_lock = false; }
  if (b.genres && b.genres.length) m.genres = b.genres; if (b.exclude_genres && b.exclude_genres.length) m.exclude_genres = [...new Set([...(a.exclude_genres || []), ...b.exclude_genres])];
  if (b.era) m.era = b.era; if (b.commercial) m.commercial = b.commercial;
  ["surprise", "emergency", "peak"].forEach(k => { if (b[k]) m[k] = true; }); return m; }
function cmd(text) { S.mods = mergeMods(S.mods, E.parseCommand(text)); refresh(); }
function setCurrent(t, dec) {
  const e = {ts: Date.now(), id: t.id, artist: t.artist, title: t.title, bpm: t.bpm, key: t.key, energy: t.energy, genre: t.genre, ai: dec && dec.ai || null, dj: dec ? dec.dj : "manual"};
  S.history.push(e); if (t.id != null) S.played.push(t.id); S.current = {id: t.id, artist: t.artist, title: t.title, bpm: t.bpm, key: t.key, energy: t.energy, genre: t.genre, year: t.year};
  S.selected = null; const m = S.mods; Object.assign(m, {energy_delta: 0, emergency: false, peak: false, surprise: false, widen_bpm: false}); refresh();
}
function act(name, id) {
  const t = recs.find(r => r.id == id) || S.lib.find(r => r.id == id); if (!t && !["clear"].includes(name)) return;
  if (name === "played") { const aiInfo = recs.find(r => r.id == id); if (aiInfo) { S.recLog.accepted++; learn(t, 1); } setCurrent(t, {dj: aiInfo ? "accepted" : "manual", ai: aiInfo ? {rank: aiInfo._rank, score: aiInfo._score, src: aiInfo._src} : null}); }
  else if (name === "select") { S.selected = S.selected == id ? null : +id; learn(t, .5); S.feedback.push({ts: Date.now(), id: t.id, type: "select"}); render(); save(); }
  else if (name === "reject") { S.rejected.push(t.id); S.recLog.rejected++; learn(t, -1); S.feedback.push({ts: Date.now(), id: t.id, type: "reject"}); toast("Odrzucono: " + t.title); refresh(); }
  else if (name === "save") { const i = S.favs.indexOf(t.id); if (i >= 0) S.favs.splice(i, 1); else S.favs.push(t.id); toast(i >= 0 ? "Usunięto z ulubionych" : "Zapisano ★"); render(); save(); }
  else if (name === "more") { const g = (t.genre || "").split(/\s+/)[0]; if (g) S.mods.genres = [g.toLowerCase()]; toast("Więcej: " + (t.genre || "")); refresh(); }
  else if (name === "fb") feedbackSheet(t);
}
function feedbackSheet(t, good) {
  $("#sheet").innerHTML = `<div class="sheet" data-close><div><h2 style="margin-top:0">Co było nie tak? — ${esc(t.title)}</h2><div class="grid2">${REASONS.map(r => `<button class="sm" data-reason="${esc(r)}" data-id="${t.id}">${r}</button>`).join("")}</div><button style="width:100%;margin-top:10px" data-close2>Anuluj</button></div></div>`;
}
function applyReason(r, id) {
  const t = S.lib.find(x => x.id == id); if (!t) return; S.feedback.push({ts: Date.now(), id: t.id, type: "bad", reason: r});
  const cur = S.current || {}; learn(t, -0.7);
  if (r === "Already Played") { if (!S.played.includes(t.id)) S.played.push(t.id); }
  else if (r === "Don't Like Artist") { if (!S.blacklist.includes(t.artist)) S.blacklist.push(t.artist); }
  else if (r === "Too Slow") S.profile.bpm.push((cur.bpm || t.bpm) + 4); else if (r === "Too Fast") S.profile.bpm.push((cur.bpm || t.bpm) - 4);
  else if (r === "Too Commercial") S.mods.commercial = -1; else if (r === "Not Commercial Enough") S.mods.commercial = 1;
  else if (r === "Too Low Energy") S.mods.energy_delta = (S.mods.energy_delta || 0) + 8; else if (r === "Too High Energy") S.mods.energy_delta = (S.mods.energy_delta || 0) - 8;
  if (!["Already Played", "Don't Like Artist"].includes(r)) S.rejected.push(t.id);
  $("#sheet").innerHTML = ""; toast("Zapisano opinię"); refresh();
}
function good(id) { const t = S.lib.find(x => x.id == id); if (t) { learn(t, .6); S.feedback.push({ts: Date.now(), id, type: "good"}); save(); toast("👍 Zapamiętane"); } }

/* ------------------------------------------------ widoki */
function recCard(t, n5) {
  const ec = Math.round(t._energy_change), bc = t._bpm_change, fav = S.favs.includes(t.id);
  return `<div class="card rec ${S.selected == t.id ? "sel" : ""}"><div class="top"><div class="rank">${n5 ? "→" : ""}${t._rank || ""}</div>
  <div style="flex:1"><div style="font-weight:800;font-size:17px">${esc(t.artist)} – ${esc(t.title)} ${t._src === "AI" ? '<span class="badge ai">AI</span>' : ""}</div>
  <div class="meta"><span>${Math.round(t.bpm || 0)} BPM</span><span>${esc(E.normalizeKey(t.key) || t.key || "?")}</span><span>Energy ${Math.round(t.energy ?? 0)}</span><span>${esc(t.genre || "")}</span>
  <span class="${ec >= 0 ? "up" : "dn"}">${ec >= 0 ? "+" : ""}${ec} Energy</span><span>${bc >= 0 ? "+" : ""}${bc} BPM</span></div></div>
  <div class="score">${Math.round(t._score)}%</div></div><div class="reason">${esc(t._reason)}</div>
  <div class="grid3"><button class="gr sm" data-a="played" data-id="${t.id}">PLAYED</button><button class="sm ${S.selected == t.id ? "on" : ""}" data-a="select" data-id="${t.id}">SELECT</button><button class="rd sm" data-a="reject" data-id="${t.id}">REJECT</button>
  <button class="sm" data-a="save" data-id="${t.id}">${fav ? "★ SAVED" : "☆ SAVE"}</button><button class="sm" data-a="more" data-id="${t.id}">MORE LIKE THIS</button>
  <div class="row"><button class="sm" data-good="${t.id}">👍</button><button class="sm" data-a="fb" data-id="${t.id}">👎</button></div></div></div>`;
}
function modChips() { const m = S.mods, c = []; if (m.energy_delta) c.push((m.energy_delta > 0 ? "+" : "") + m.energy_delta + " energii"); if (m.bpm_lock) c.push("KEEP BPM"); if (m.widen_bpm) c.push("CHANGE BPM");
  if (m.genres.length) c.push("→ " + m.genres.join("/")); if (m.exclude_genres.length) c.push("bez: " + m.exclude_genres.join("/").replace("__CURRENT__", "obecnego")); if (m.era) c.push(m.era);
  if (m.commercial) c.push(m.commercial > 0 ? "komercyjnie" : "mniej komercji"); if (m.surprise) c.push("SURPRISE"); if (m.emergency) c.push("EMERGENCY"); if (m.peak) c.push("PEAK"); return c; }

function vPlay() {
  const c = S.current, issues = E.detectIssues(S.history), chips = modChips();
  let h = `<div class="chips" style="margin:6px 0 10px;overflow:auto;flex-wrap:nowrap">${MODES.map(m => `<button class="sm ${S.mode === m ? 'on' : ''}" data-mode="${m}" style="white-space:nowrap">${m}</button>`).join("")}</div>`;
  h += `<div class="card cur"><div class="mut">TERAZ GRAM • ${hhmm(hourNow())} • ${esc(S.mode)}</div>${c ? `<div class="name">${esc(c.artist)} – ${esc(c.title)}</div>
  <div class="big"><div><b>${Math.round(c.bpm || 0)}</b><small>BPM</small></div><div><b>${esc(E.normalizeKey(c.key) || c.key || "–")}</b><small>KEY</small></div><div><b>${Math.round(c.energy ?? 0)}</b><small>ENERGY</small></div></div>` : `<div class="name">Nie wybrano utworu</div>`}
  <button style="width:100%;margin-top:10px" class="${c ? "" : "pk"}" data-pick>${c ? "ZMIEŃ AKTUALNY UTWÓR" : "WYBIERZ CO GRASZ TERAZ"}</button></div>`;
  if (!c) return h + `<div class="card mut">${S.lib.length ? "Wybierz utwór, który teraz gra — dostaniesz rekomendacje." : "Biblioteka jest pusta. Wejdź w zakładkę BIBLIOTEKA i zaimportuj CSV/JSON albo wczytaj DEMO."}</div>`;

  else if (d.reason) applyReason(d.reason, d.id); else if (d.close2 !== undefined || d.closepick !== undefined) $("#sheet").innerHTML = "";
  else if (d.pick !== undefined) pickSheet();
  else if (d.usecur) { $("#sheet").innerHTML = ""; setCurrent(S.lib.find(t => t.id == d.usecur), {dj: "manual"}); tab = "play"; }
  else if (d.setcur) { setCurrent(S.lib.find(t => t.id == d.setcur), {dj: "manual"}); tab = "play"; render(); }
  else if (d.manual !== undefined) { const a = $("#m_a").value.trim(), t = $("#m_t").value.trim(); if (!a || !t) return toast("Wpisz artystę i tytuł");
    const key = $("#m_k").value.trim(), tr = {artist: a, title: t, bpm: num($("#m_b").value, null), key: E.normalizeKey(key) || key || null, energy: num($("#m_e").value, 70), genre: $("#m_g").value.trim() || null, year: null, popularity: 50, danceability: 60, vocal: "vocal", tags: [], source: "manual"};
    addTracks([tr]); $("#sheet").innerHTML = ""; setCurrent(S.lib.find(x => x.artist === a && x.title === t), {dj: "manual"}); }
  else if (d.stagelinqCheck !== undefined) checkStageLinqModule();
  else if (d.stagelinqMulticast !== undefined) prepareStageLinqWifi();
  else if (d.q) quick(d.q);
  else if (d.send !== undefined) sendChat();
  else if (d.endset !== undefined) endSet();
  else if (d.import !== undefined) $("#file").click();
  else if (d.demo !== undefined) { const r = addTracks(window.DEMO_LIB.map(t => Object.assign({}, t))); toast(`Wczytano ${r.add} utworów demo`); render(); }
  else if (d.fmt !== undefined) $("#sheet").innerHTML = `<div class="sheet" data-close><div><h2 style="margin-top:0">Wzór pliku CSV</h2><textarea rows="7" readonly>artist,title,bpm,key,energy,genre,year,source\nCalvin Harris,Summer,128,8A,84,Commercial Dance,2014,mojekatalog\nDavid Guetta,Przykład,128,9A,89,EDM,2020,mojekatalog</textarea><div class="mut" style="margin:8px 0">Kolumny mogą być w dowolnej kolejności; separator , lub ; ; BPM z przecinkiem OK; tonacja jako 8A albo Am; energia 1-10 (Mixed In Key) jest przeliczana na 1-100. Możliwe też: popularity, danceability, vocal, tags, subgenre. Poza artist i title wszystko jest opcjonalne.</div><button style="width:100%" data-close2>Zamknij</button></div></div>`;
  else if (d.addtrack !== undefined) pickSheet();
  else if (d.clearlib !== undefined) { if (confirm("Usunąć całą bibliotekę?")) { S.lib = []; S.current = null; recs = []; save(); render(); } }
  else if (d.age) { toggle(S.crowd.age_groups, d.age); post(); } else if (d.mus) { toggle(S.crowd.music_preferences, d.mus); post(); }
  else if (d.size) { S.crowd.crowd_size = d.size; post(); } else if (d.event) { S.crowd.event_type = d.event; post(); }
  else if (d.toggleai !== undefined) { S.cfg.useAI = !S.cfg.useAI; post(); }
  else if (d.testkey !== undefined) testKey();
  else if (d.wreset !== undefined) { S.weights = Object.assign({}, E.DEFAULT_WEIGHTS); post(); }
  else if (d.resetprofile !== undefined) { S.profile = {g: {}, a: {}, bpm: []}; post(); } else if (d.clearbl !== undefined) { S.blacklist = []; post(); }
  else if (d.resetall !== undefined) { if (confirm("Na pewno usunąć wszystko (biblioteka, sety, profil, klucz)?")) { localStorage.removeItem(KEY); S = DEF(); S.mods = E.parseCommand(""); recs = []; render(); } }
});
function toggle(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function post() { save(); render(); if (tab === "cfg") return; }
document.addEventListener("input", ev => { const t = ev.target;
  if (t.id === "apikey") { S.cfg.apiKey = t.value.trim(); save(); } else if (t.id === "model") { S.cfg.model = t.value.trim() || "gpt-4o-mini"; save(); }
  else if (t.id === "hourov") { S.cfg.hourOverride = t.value.trim(); save(); } else if (t.id === "crowden") { S.crowd.crowd_energy = +t.value; $("#cev").textContent = t.value; save(); }
  else if (t.dataset.w) { S.weights[t.dataset.w] = +t.value / 100; $("#wv_" + t.dataset.w).textContent = t.value + "%"; save(); }
  else if (t.id === "libq") libList(); });
document.addEventListener("change", ev => { if (ev.target.id === "file" && ev.target.files[0]) importFile(ev.target.files[0]); });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "chatin") sendChat(); });
function quick(q) {
  view5 = q === "next5" ? !view5 : (q === "clear" ? view5 : false);
  if (q === "raise") cmd("zwiększ energię"); else if (q === "lower") cmd("zejdź z energii"); else if (q === "keepbpm") { S.mods.bpm_lock = !S.mods.bpm_lock; if (S.mods.bpm_lock) S.mods.widen_bpm = false; refresh(); }
  else if (q === "changebpm") { S.mods.widen_bpm = !S.mods.widen_bpm; if (S.mods.widen_bpm) S.mods.bpm_lock = false; refresh(); } else if (q === "genre") cmd("zmień gatunek");
  else if (q === "surprise") cmd("surprise me"); else if (q === "peak") { S.mode = "PEAK TIME"; cmd("peak time"); } else if (q === "emergency") { cmd("parkiet umiera"); toast("EMERGENCY: hity + danceability"); }
  else if (q === "clear") { S.mods = E.parseCommand(""); refresh(); } else if (q === "next5") refresh();
}
function endSet() {
  if (!S.history.length) return toast("Set jest pusty"); const s = stats(S.history);
  $("#sheet").innerHTML = `<div class="sheet"><div><h2 style="margin-top:0">SET ANALYTICS</h2>${statsHtml(S.history)}<button class="pk" style="width:100%;margin-top:10px" data-savenew>ZAPISZ I ROZPOCZNIJ NOWY SET</button><button style="width:100%;margin-top:8px" data-close2>Wróć</button></div></div>`;
  $("[data-savenew]").onclick = () => { S.sets.push({start: S.history[0].ts, n: s.n, avgBpm: s.avgBpm, avgE: s.avgE, eff: s.eff}); S.history = []; S.played = []; S.rejected = []; S.recLog = {accepted: 0, rejected: 0, shown: 0}; S.mods = E.parseCommand(""); S.current = null; recs = []; $("#sheet").innerHTML = ""; save(); tab = "play"; render(); };
}
async function testKey() {
  if (!S.cfg.apiKey) return toast("Wpisz klucz API");
  try { const r = await fetch("https://api.openai.com/v1/models/" + encodeURIComponent(S.cfg.model), {headers: {Authorization: "Bearer " + S.cfg.apiKey}});
    toast(r.ok ? "✅ Klucz działa" : r.status === 401 ? "❌ Klucz nieprawidłowy" : r.status === 404 ? "❌ Model nie istnieje / brak dostępu" : r.status === 429 ? "❌ Limit / brak środków" : "❌ Błąd " + r.status); }
  catch (e) { toast("❌ Brak internetu"); }
}
render(); if (S.current) refresh();
window.__S = () => S; window.__refresh = refresh;
</script>
</body>
