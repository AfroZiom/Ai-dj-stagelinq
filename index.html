<style>
:root{

.badge.ai{

}
nav{

}

<script src="engine.js"></script>
<script src="demo.js"></script>

<script>
"use strict";

const E = window.Engine;

const KEY = "aidj_state_v2";

const MODES = [
 "WARM UP",
 "BUILDING",
 "MAIN",
 "PEAK TIME",
 "AFTER PEAK",
 "CLOSING",
 "CUSTOM"
];

const AGES = [
 "18–24",
 "25–34",
 "35–44",
 "45+"
];

const MUSIC = [
 "Commercial",
 "Club",
 "House",
 "Tech House",
 "EDM",
 "Hip-Hop",
 "Pop",
 "Dance",
 "2000s",
 "2010s",
 "2020s",
 "Polish Hits",
 "Polish Pop",
 "Polish Dance",
 "Polish Club",
 "Polish Classics",
 "International Hits",
 "Mixed"
];

const SIZES = [
 "Small",
 "Medium",
 "Large",
 "Very Large"
];

const EVENTS = [
 "Club",
 "Wedding",
 "Festival",
 "Private Party",
 "Corporate",
 "Beach Party",
 "Student Party",
 "Other"
];

const REASONS = [
 "Too Slow",
 "Too Fast",
 "Wrong Genre",
 "Too Commercial",
 "Not Commercial Enough",
 "Too Low Energy",
 "Too High Energy",
 "Bad Transition",
 "Already Played",
 "Don't Like Artist"
];

const WLABEL = {
 music_compatibility:"Zgodność muzyczna",
 energy_flow:"Przepływ energii",
 bpm:"BPM",
 harmonic:"Harmonia",
 danceability:"Danceability",
 popularity:"Popularność",
 crowd:"Profil publiczności",
 set_history:"Historia seta"
};

const DEF = () => ({
 lib: [],
 nextId: 1,
 current: null,
 history: [],
 played: [],
 rejected: [],
 favs: [],
 blacklist: [],
 selected: null,

 mode: "MAIN",
 mods: null,
 sets: [],
 feedback: [],
 chat: [],
 setStart: Date.now(),

 recLog:{
   accepted:0,
   rejected:0,
   shown:0
 },

 crowd:{
   age_groups:["25–34"],
   music_preferences:["Commercial","Club"],
   crowd_size:"Medium",
   crowd_energy:70,
   event_type:"Club"
 },

 weights:Object.assign({},E.DEFAULT_WEIGHTS),

 profile:{
   g:{},
   a:{},
   bpm:[]
 },

 cfg:{
   apiKey:"",
   model:"gpt-4o-mini",
   useAI:true,
   hourOverride:""
 },

 /* StageLinQ */
 stageLinq:{
   connected:false,
   device:null,
   nowPlaying:null,
   listenersReady:false
 }
});

let S = load();

function load(){
 try{
   const s=JSON.parse(localStorage.getItem(KEY));

   if(s){
     const d=DEF();

     return Object.assign(
       d,
       s,
       {
         cfg:Object.assign(d.cfg,s.cfg||{}),
         stageLinq:Object.assign(
           d.stageLinq,
           s.stageLinq||{}
         )
       }
     );
   }

 }catch(e){}

 return DEF();
}

function save(){
 try{
   localStorage.setItem(KEY,JSON.stringify(S));
 }catch(e){
   toast("Brak miejsca na zapis danych!");
 }
}

S.mods=S.mods||E.parseCommand("");

let tab="play";
let view5=false;
let recs=[];
let recLvl=0;
let aiState="";
let reqId=0;
let aiCache=new Map();
let next5=[];

const $=s=>document.querySelector(s);

const esc=s=>String(
 s==null?"":s
).replace(
 /[&<>"']/g,
 c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
 }[c])
);

const num=(v,d)=>{
 const x=parseFloat(
   String(v).replace(",",".")
 );
 return isNaN(x)?d:x;
};

function toast(m){
 const d=document.createElement("div");

 d.textContent=m;

 d.style.cssText=
 "position:fixed;left:50%;bottom:90px;" +
 "transform:translateX(-50%);" +
 "background:#fff;color:#000;" +
 "padding:10px 16px;" +
 "border-radius:99px;" +
 "z-index:50;font-weight:700;font-size:14px";

 document.body.appendChild(d);

 setTimeout(()=>d.remove(),1800);
}

function hourNow(){

 const o=S.cfg.hourOverride;

 if(
   o &&
   /^\d{1,2}:\d{2}$/.test(o)
 ){
   const [h,m]=o.split(":");

   return +h + +m/60;
 }

 const d=new Date();

 return d.getHours()+
        d.getMinutes()/60;
}

const hhmm=h=>
 String(Math.floor(h)).padStart(2,"0")+
 ":"+
 String(Math.round((h%1)*60)).padStart(2,"0");


/* =========================================================
   PROFIL DJ-A
========================================================= */

function bump(map,k,v){

 if(!k)return;

 k=k.toLowerCase();

 map[k]=Math.max(
   -12,
   Math.min(
     12,
     (map[k]||0)+v
   )
 );
}

function learn(t,w){

 const g=(t.genre||"")
   .toLowerCase()
   .split(/\s+/)[0];

 bump(
   S.profile.g,
   g,
   w
 );

 bump(
   S.profile.a,
   t.artist,
   w*1.2
 );

 if(w>0 && t.bpm){

   S.profile.bpm.push(t.bpm);

   S.profile.bpm=
     S.profile.bpm.slice(-30);
 }
}

function djProfile(){

 const n=o=>
   Object.fromEntries(
     Object.entries(o).map(
       ([k,v])=>[
         k,
         Math.tanh(v/5)
       ]
     )
   );

 const b=S.profile.bpm;

 return {
   genre_affinity:n(S.profile.g),
   artist_affinity:n(S.profile.a),
   bpm_center:
     b.length>=5
       ?b.reduce((x,y)=>x+y,0)/b.length
       :null
 };
}


/* =========================================================
   KONTEKST
========================================================= */

function ctx(){

 return {
   mode:S.mode,
   hour:hourNow(),
   mods:S.mods,
   weights:S.weights,
   crowd:S.crowd,
   dj_profile:djProfile(),
   history:S.history,

   recent_energies:
     S.history
       .map(h=>h.energy)
       .filter(e=>e!=null)
       .slice(-4),

   played_ids:[
     ...S.played,
     ...S.rejected
   ],

   blacklist:
     new Set(
       S.blacklist.map(
         a=>a.toLowerCase()
       )
     )
 };
}

function summary(c){

 const cur=S.current||{};

 return JSON.stringify({

   teraz:
     cur.artist
       ?`${cur.artist} - ${cur.title}, `+
        `${cur.bpm} BPM, ${cur.key}, `+
        `energy ${cur.energy}, ${cur.genre}`
       :null,

   tryb:S.mode,

   godzina:hhmm(c.hour),

   cel_energii:
     Math.round(
       E.energyTarget(
         S.mode,
         c.hour,
         c.recent_energies,
         S.crowd.crowd_energy,
         S.mods.energy_delta||0,
         cur.energy
       )
     ),

   publicznosc:S.crowd,

   aktywne_polecenia:S.mods,

   ostatnie:
     S.history.slice(-5).map(
       h=>`${h.artist} - ${h.title} `+
          `(${h.bpm}/${h.energy})`
     ),

   profil_dj:djProfile()
 });
}


/* =========================================================
   REKOMENDACJE
========================================================= */

function refresh(){

 if(!S.current){
   recs=[];
   render();
   return;
 }

 const c=ctx();

 const [
   top,
   lvl,
   all
 ]=E.recommend(
   S.lib,
   S.current,
   c,
   5
 );

 recs=top.map(
   (t,i)=>
     Object.assign(
       t,
       {
         _rank:i+1,
         _src:"LOKALNIE"
       }
     )
 );

 recLvl=lvl;

 S.recLog.shown+=recs.length;

 aiState="";

 next5=
   view5
     ?E.planNext5(
        S.lib,
        S.current,
        c,
        5
      )
     :next5;

 render();

 save();

 if(
   S.cfg.useAI &&
   S.cfg.apiKey &&
   all.length
 ){
   aiRank(
     all.slice(0,15),
     c
   );
 }
}


/* =========================================================
   OPENAI
========================================================= */

async function openai(messages){

 const ctl=new AbortController();

 const to=setTimeout(
   ()=>ctl.abort(),
   20000
 );

 const body={
   model:S.cfg.model,
   response_format:{
     type:"json_object"
   },
   messages
 };

 const call=async b=>
   fetch(
     "https://api.openai.com/v1/chat/completions",
     {
       method:"POST",
       signal:ctl.signal,
       headers:{
         "Content-Type":"application/json",
         Authorization:
           "Bearer "+S.cfg.apiKey
       },
       body:JSON.stringify(b)
     }
   );

 try{

   let r=await call(
     Object.assign(
       {temperature:0.3},
       body
     )
   );

   if(!r.ok){

     const t=await r.text();

     if(/temperature/i.test(t)){

       r=await call(body);

     }else{

       throw new Error(
         r.status===401
           ?"Klucz OpenAI jest nieprawidłowy"
           :r.status===429
             ?"Limit / brak środków na koncie OpenAI"
             :"Błąd OpenAI "+r.status
       );
     }
   }

   if(!r.ok)
     throw new Error(
       "Błąd OpenAI "+r.status
     );

   return JSON.parse(
     (await r.json())
       .choices[0]
       .message
       .content
   );

 }catch(e){

   throw new Error(
     e.name==="AbortError"
       ?"AI nie odpowiedziało w 20 s"
       :(e.message||"Brak internetu")
   );

 }finally{

   clearTimeout(to);
 }
}

const compact=t=>({

 id:t.id,
 artist:t.artist,
 title:t.title,
 bpm:t.bpm,
 key_camelot:
   E.normalizeKey(t.key)||t.key,
 energy:t.energy,
 genre:t.genre,
 year:t.year,
 popularity:t.popularity,
 danceability:t.danceability,
 local_score:t._score

});

const SYS=
 "Jesteś AI DJ ASSISTANT - ekspert od prowadzenia setów klubowych, "+
 "ze świetną znajomością polskiej i międzynarodowej sceny dance/club. "+
 "Wybierz i uargumentuj najlepsze NEXT TRACKI. "+
 "DJ DECYDUJE, ty REKOMENDUJESZ. "+
 "Wybieraj WYŁĄCZNIE spośród podanych kandydatów (po id). "+
 "Odpowiadasz WYŁĄCZNIE poprawnym JSON.";

async function aiRank(cands,c){

 const my=++reqId;

 const sum=summary(c);

 const ck=
   sum+
   cands.map(t=>t.id).join(",");

 let out=aiCache.get(ck);

 if(!out){

   aiState="AI analizuje…";

   render();

   try{

     out=await openai([

       {
         role:"system",
         content:SYS
       },

       {
         role:"user",
         content:JSON.stringify({

           context:sum,

           kandydaci_posortowani_wg_lokalnego_score:
             cands.map(compact),

           zadanie:
             "Wybierz TOP 5 i zwróć JSON: "+
             "{\"recommendations\":["+
             "{\"track_id\":<id z listy>,"+
             "\"reason\":\"1-2 zdania po polsku\"}"+
             "],"+
             "\"mode_suggestion\":"+
             "\"WARM UP|BUILDING|MAIN|PEAK TIME|AFTER PEAK|CLOSING|null\"}"

         })
       }

     ]);

     aiCache.set(ck,out);

   }catch(e){

     if(my===reqId){

       aiState=
         "AI niedostępne: "+
         e.message+
         " (ranking lokalny)";

       render();
     }

     return;
   }
 }

 if(my!==reqId)return;

 const byId=
   new Map(
     cands.map(
       t=>[String(t.id),t]
     )
   );

 const seen=new Set();
 const pick=[];

 for(
   const r of out.recommendations||[]
 ){

   const t=
     byId.get(
       String(r.track_id)
     );

   if(
     t &&
     !seen.has(t.id)
   ){

     seen.add(t.id);

     pick.push(
       Object.assign(
         {},
         t,
         {
           _reason:
             String(
               r.reason||
               t._reason
             ),

           _src:"AI"
         }
       )
     );
   }
 }

 if(!pick.length){

   aiState=
     "AI zwróciło nieprawidłowe utwory (ranking lokalny)";

   render();

   return;
 }

 for(const t of recs){

   if(
     pick.length<5 &&
     !seen.has(t.id)
   ){

     pick.push(t);
   }
 }

 recs=
   pick
     .slice(0,5)
     .map(
       (t,i)=>
         Object.assign(
           t,
           {_rank:i+1}
         )
     );

 aiState="";

 if(
   out.mode_suggestion &&
   out.mode_suggestion!=="null" &&
   MODES.includes(
     out.mode_suggestion
   ) &&
   out.mode_suggestion!==S.mode
 ){

   aiState=
     "AI sugeruje tryb: "+
     out.mode_suggestion;
 }

 render();
}


/* =========================================================
   AKCJE DJ-A
========================================================= */

function mergeMods(a,b){

 const m=Object.assign({},a);

 m.energy_delta=
   Math.max(
     -40,
     Math.min(
       40,
       (a.energy_delta||0)+
       (b.energy_delta||0)
     )
   );

 if(b.bpm_lock){

   m.bpm_lock=true;
   m.widen_bpm=false;
 }

 if(b.widen_bpm){

   m.widen_bpm=true;
   m.bpm_lock=false;
 }

 if(
   b.genres &&
   b.genres.length
 ){
   m.genres=b.genres;
 }

 if(
   b.exclude_genres &&
   b.exclude_genres.length
 ){

   m.exclude_genres=[
     ...(a.exclude_genres||[]),
     ...b.exclude_genres
   ];

 }

 if(b.era)m.era=b.era;

 if(b.commercial)
   m.commercial=b.commercial;

 [
   "surprise",
   "emergency",
   "peak"
 ].forEach(k=>{
   if(b[k])m[k]=true;
 });

 return m;
}

function cmd(text){

 S.mods=
   mergeMods(
     S.mods,
     E.parseCommand(text)
   );

 refresh();
}

function setCurrent(t,dec){

 if(!t)return;

 const e={
   ts:Date.now(),
   id:t.id,
   artist:t.artist,
   title:t.title,
   bpm:t.bpm,
   key:t.key,
   energy:t.energy,
   genre:t.genre,
   ai:dec&&dec.ai||null,
   dj:dec?dec.dj:"manual"
 };

 S.history.push(e);

 if(t.id!=null)
   S.played.push(t.id);

 S.current={
   id:t.id,
   artist:t.artist,
   title:t.title,
   bpm:t.bpm,
   key:t.key,
   energy:t.energy,
   genre:t.genre,
   year:t.year
 };

 S.selected=null;

 const m=S.mods;

 Object.assign(
   m,
   {
     energy_delta:0,
     emergency:false,
     peak:false,
     surprise:false,
     widen_bpm:false
   }
 );

 refresh();
}

function act(name,id){

 const t=
   recs.find(r=>r.id==id)||
   S.lib.find(r=>r.id==id);

 if(
   !t &&
   !["clear"].includes(name)
 )return;

 if(name==="played"){

   const aiInfo=
     recs.find(r=>r.id==id);

   if(aiInfo){

     S.recLog.accepted++;

     learn(t,1);
   }

   setCurrent(
     t,
     {
       dj:
         aiInfo
           ?"accepted"
           :"manual",

       ai:
         aiInfo
           ?{
              rank:aiInfo._rank,
              score:aiInfo._score,
              src:aiInfo._src
            }
           :null
     }
   );

 }else if(name==="select"){

   S.selected=
     S.selected==id
       ?null
       :+id;

   learn(t,.5);

   S.feedback.push({
     ts:Date.now(),
     id:t.id,
     type:"select"
   });

   render();
   save();

 }else if(name==="reject"){

   S.rejected.push(t.id);

   S.recLog.rejected++;

   learn(t,-1);

   S.feedback.push({
     ts:Date.now(),
     id:t.id,
     type:"reject"
   });

   toast(
     "Odrzucono: "+t.title
   );

   refresh();

 }else if(name==="save"){

   const i=
     S.favs.indexOf(t.id);

   if(i>=0)
     S.favs.splice(i,1);
   else
     S.favs.push(t.id);

   toast(
     i>=0
       ?"Usunięto z ulubionych"
       :"Zapisano ★"
   );

   render();
   save();

 }else if(name==="more"){

   const g=
     (t.genre||"")
       .split(/\s+/)[0];

   if(g)
     S.mods.genres=[
       g.toLowerCase()
     ];

   toast(
     "Więcej: "+(t.genre||"")
   );

   refresh();

 }else if(name==="fb"){

   feedbackSheet(t);
 }
}

function applyReason(r,id){

 const t=
   S.lib.find(x=>x.id==id);

 if(!t)return;

 S.feedback.push({
   ts:Date.now(),
   id:t.id,
   type:"bad",
   reason:r
 });

 const cur=S.current||{};

 learn(t,-0.7);

 if(r==="Already Played"){

   if(!S.played.includes(t.id))
     S.played.push(t.id);

 }else if(r==="Don't Like Artist"){

   if(!S.blacklist.includes(t.artist))
     S.blacklist.push(t.artist);

 }else if(r==="Too Slow"){

   S.profile.bpm.push(
     (cur.bpm||t.bpm)+4
   );

 }else if(r==="Too Fast"){

   S.profile.bpm.push(
     (cur.bpm||t.bpm)-4
   );

 }else if(r==="Too Commercial"){

   S.mods.commercial=-1;

 }else if(r==="Not Commercial Enough"){

   S.mods.commercial=1;

 }else if(r==="Too Low Energy"){

   S.mods.energy_delta=
     (S.mods.energy_delta||0)+8;

 }else if(r==="Too High Energy"){

   S.mods.energy_delta=
     (S.mods.energy_delta||0)-8;
 }

 if(
   ![
     "Already Played",
     "Don't Like Artist"
   ].includes(r)
 ){
   S.rejected.push(t.id);
 }

 $("#sheet").innerHTML="";

 toast("Zapisano opinię");

 refresh();
}

 }

async function sendChat(){
  const input=$("#chatinput");
  const log=$("#chatlog");
  if(!input || !log)return;

  const q=input.value.trim();
  if(!q)return;

  log.innerHTML += `<div class="msg me">${esc(q)}</div>`;
  input.value="";

  const reply=await localReply(q);

  log.innerHTML += `<div class="msg ai">${esc(reply)}</div>`;
  log.scrollTop=log.scrollHeight;
}

async function localReply(q){
  const x=q.toLowerCase();

  if(x.includes("mocniej") || x.includes("energia")){
    return "Wybierz utwór o wyższej energii i podobnym BPM. Mogę też przygotować kolejne rekomendacje.";
  }

  if(x.includes("bpm") && S.current){
    return `Aktualny utwór ma około ${S.current.bpm || "nieznanego"} BPM.`;
  }

  if(x.includes("następ") || x.includes("dalej")){
    const r=aiRank(S.lib,S.current).slice(0,3);
    return r.length
      ? "Proponuję: " + r.map(t=>`${t.artist} – ${t.title}`).join(" | ")
      : "Brak wystarczających danych do rekomendacji.";
  }

  return "Analizuję kontekst imprezy. Spróbuj np. „daj coś mocniejszego”, „co zagrać dalej?” albo „utrzymaj tempo”.";
}

async function handleStageNowPlaying(data){
  if(!data)return;

  const artist=String(data.artist || "").trim();
  const title=String(data.title || "").trim();

  if(!artist && !title)return;

  const bpm=Number(data.bpm) || 0;
  const key=String(data.key || "").trim();
  const genre=String(data.genre || "").trim();

  let track=S.lib.find(x=>
    String(x.artist||"").toLowerCase()===artist.toLowerCase() &&
    String(x.title||"").toLowerCase()===title.toLowerCase()
  );

  if(!track){
    track={
      id:S.nextId++,
      title:title || "Unknown",
      artist:artist || "Unknown",
      genre,
      bpm,
      key,
      energy:60,
      danceability:60,
      popularity:50,
      vocal:"vocal",
      tags:[],
      source:"StageLinQ"
    };

    S.lib.push(track);
  }else{
    if(bpm)track.bpm=bpm;
    if(key)track.key=key;
    if(genre)track.genre=genre;
    track.source="StageLinQ";
  }

  const same =
    S.current &&
    String(S.current.artist||"").toLowerCase()===artist.toLowerCase() &&
    String(S.current.title||"").toLowerCase()===title.toLowerCase();

  S.stageLinq.connected=true;
  S.stageLinq.nowPlaying={
    ...data,
    artist,
    title,
    bpm,
    key,
    genre
  };

  if(!same){
    setCurrent(track,{dj:"stagelinq",source:"StageLinQ"});
  }

  save();
  showStageNowPlaying(S.stageLinq.nowPlaying);
}

async function installStageLinqListeners(){
  if(S.stageLinq.listenersReady)return;

  const plugin=stagePlugin();

  if(!plugin){
    stageStatus("natywny moduł StageLinQ nie jest dostępny. Zainstaluj APK z aktualnego workflow.");
    return;
  }

  try{
    if(plugin.addListener){

      await plugin.addListener("deviceDiscovered",data=>{
        S.stageLinq.device=data || null;

        stageStatus(
          "wykryto " +
          (data?.deviceName || "Denon Prime 4+") +
          (data?.ip ? " • "+data.ip : ""),
          true
        );

        toast("Denon Prime 4+ wykryty");
      });

      await plugin.addListener("directoryReady",data=>{
        stageStatus(
          "Directory OK • oczekiwanie na StateMap" +
          (data?.port ? " • port "+data.port : ""),
          true
        );
      });

      await plugin.addListener("stateMapConnected",data=>{
        S.stageLinq.connected=true;
        stageStatus("StateMap połączony — oczekiwanie na dane decków.",true);
      });

      await plugin.addListener("nowPlaying",data=>{
        handleStageNowPlaying(data);
      });
    }

    S.stageLinq.listenersReady=true;
    save();

  }catch(e){
    stageStatus("błąd listenerów: "+(e.message || String(e)));
  }
}

async function discoverStageLinq(){
  const plugin=stagePlugin();

  if(!plugin){
    stageStatus("Brak natywnego modułu StageLinQ w tym APK.");
    return;
  }

  await installStageLinqListeners();

  try{
    if(typeof plugin.acquireMulticastLock==="function"){
      await plugin.acquireMulticastLock();
    }

    if(typeof plugin.discover==="function"){
      stageStatus("Wyszukiwanie Denon Prime 4+…");
      await plugin.discover();
    }else{
      stageStatus(
        "Moduł jest obecny, ale ta wersja APK nie udostępnia funkcji discover()."
      );
    }

  }catch(e){
    stageStatus("Błąd wykrywania: "+(e.message || String(e)));
  }
}

function importCSV(text){
  const lines=String(text||"")
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(!lines.length)return;

  const first=lines[0].toLowerCase();

  for(let i=first.includes("title") ? 1 : 0;i<lines.length;i++){

    const p=lines[i].split(",");

    if(p.length<2)continue;

    const artist=(p[0]||"").trim();
    const title=(p[1]||"").trim();

    if(!title)continue;

    S.lib.push({
      id:S.nextId++,
      artist,
      title,
      bpm:Number(p[2])||0,
      genre:p[3]||"",
      energy:Number(p[4])||60,
      danceability:Number(p[5])||60,
      popularity:Number(p[6])||50,
      vocal:"vocal",
      tags:[]
    });
  }

  save();
  render();
  toast("Biblioteka zaimportowana");
}

function render(){
  const view=$("#view");
  if(!view)return;

  if(S.page==="play")vPlay();
  else if(S.page==="chat")vChat();
  else if(S.page==="stats")stats();
  else if(S.page==="lib")vLib();
  else if(S.page==="settings")vSettings();
  else vPlay();

  installStageLinqListeners();
}

document.addEventListener("click",e=>{

  const d=e.target.closest("[data-page]");
  if(d){
    S.page=d.dataset.page;
    save();
    render();
    return;
  }

  const p=e.target.closest("[data-play]");
  if(p){
    const t=S.lib.find(x=>String(x.id)===String(p.dataset.play));
    if(t){
      setCurrent(t,{dj:"manual"});
      render();
    }
    return;
  }

  const g=e.target.closest("[data-good]");
  if(g){
    good(Number(g.dataset.good));
    return;
  }

  if(e.target.closest("[data-chat-send]")){
    sendChat();
    return;
  }

  if(e.target.closest("[data-save-api]")){
    const key=$("#apiKey")?.value.trim() || "";
    S.settings.apiKey=key;
    save();
    toast("Klucz zapisany lokalnie");
    return;
  }

  if(e.target.closest("[data-stagelinq-discover]")){
    discoverStageLinq();
    return;
  }

  if(e.target.closest("[data-stagelinq-multicast]")){
    const plugin=stagePlugin();

    if(!plugin || typeof plugin.acquireMulticastLock!=="function"){
      stageStatus("Brak natywnego modułu StageLinQ.");
      return;
    }

    plugin.acquireMulticastLock()
      .then(()=>stageStatus("Multicast Wi-Fi przygotowany."))
      .catch(err=>stageStatus("Błąd Wi-Fi: "+(err.message || String(err))));

    return;
  }

  if(e.target.closest("[data-export]")){
    const blob=new Blob(
      [JSON.stringify(S,null,2)],
      {type:"application/json"}
    );

    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="ai-dj-assistant-data.json";
    a.click();

    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    return;
  }

  if(e.target.closest("[data-clear]")){
    if(confirm("Wyczyścić lokalne dane aplikacji?")){
      localStorage.removeItem(KEY);
      location.reload();
    }
  }
});
